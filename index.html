<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>FITMEET — Fitness Event Discovery & Collaboration Platform</title>
    <meta
      name="description"
      content="Connecting fitness enthusiasts, gyms, coaches, and brands. Discover community runs, gym meetups, and co-hosted fitness events across India."
    />
    <meta
      property="og:title"
      content="FITMEET — Fitness Event Discovery & Collaboration Platform"
    />
    <meta
      property="og:description"
      content="Connecting fitness enthusiasts, gyms, coaches, and brands. Discover community runs, gym meetups, and co-hosted fitness events across India."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#0a0a0c" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('fitmeet_theme_preference');
          var prefersLight =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
          var theme = saved || (prefersLight ? 'light' : 'dark');
          document.documentElement.classList.remove('light', 'dark');
          document.documentElement.classList.add(theme);
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;1,700&family=Montserrat:ital,wght@1,800;1,900&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  </head>
  <body
    class="bg-[var(--bg)] text-[var(--fg)] antialiased selection:bg-[#FC5300] selection:text-white transition-colors duration-200"
  >
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
